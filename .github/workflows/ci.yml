name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testbed]"
      - name: Unit tests
        run: pytest -m "not slow" -q
      - name: End-to-end, README and example tests
        run: pytest -m slow -q

  core-only:
    # the core must import and work with numpy alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -c "import drongo; g = drongo.FrameGeometry.from_pose(drongo.PoseSample(0, 32, 35, 80, 0, -90), drongo.CameraModel.preset('equiv_24mm'), 1920, 1080, drongo.LocalFrame(32, 35)); print(g.footprint().area_m2)"
